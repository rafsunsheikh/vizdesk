[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vizdesk"
version = "0.2.0"
description = "A terminal app that scans CSV and Excel files, suggests cleaning and charts, and draws PNG figures. No LLM needed."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Md Rafsun Sheikh" }]
keywords = ["tui", "data-visualization", "matplotlib", "csv", "excel", "textual"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "pillow>=10",
  "textual>=0.80",
]

[project.urls]
Homepage = "https://github.com/rafsunsheikh/vizdesk"
Issues = "https://github.com/rafsunsheikh/vizdesk/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
vizdesk = "vizdesk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vizdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
